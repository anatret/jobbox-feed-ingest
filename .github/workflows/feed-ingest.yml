name: Объявления из Telegram

on:
  # Расписание задаёт база Jobbox: pg_cron вызывает workflow_dispatch.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Проверка без записи в базу и без отчёта'
        type: boolean
        default: false

concurrency:
  group: feed-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Загрузка
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          INGEST_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python ingest.py
